name: Research package tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python project.py validate examples/known-star
      - run: python examples/known-star/repro/verify.py
      - run: python -m pip install cffconvert==2.0.0
      - run: cffconvert --validate
      - run: |
          python project.py init /tmp/research-citation-test --id control --statement 'Synthetic fixture'
          python discovery_citation.py /tmp/research-citation-test examples/confirmed-metadata.example.json
          python project.py seal /tmp/research-citation-test
          python project.py validate /tmp/research-citation-test --publication
          cffconvert -i /tmp/research-citation-test/CITATION.cff --validate
