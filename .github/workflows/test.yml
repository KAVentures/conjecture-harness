name: Research package tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    working-directory: engine
jobs:
  chat-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - working-directory: .
        run: |
          python chat/build.py --check
          python chat/test_transport.py -v
      - name: Package verified full checkout for connector download
        id: package
        working-directory: .
        run: |
          revision=$(git rev-parse HEAD)
          mkdir -p chat-artifact
          git archive --format=zip --prefix="conjecture-harness-$revision/" --output="chat-artifact/harness-$revision.zip" HEAD
          (cd chat-artifact && sha256sum "harness-$revision.zip" > SHA256SUMS)
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          python chat/bootstrap.py --revision "$revision" --archive "chat-artifact/harness-$revision.zip" --output "$RUNNER_TEMP/chat-archive-check"
          cd "$RUNNER_TEMP/chat-archive-check/engine"
          python engine_readiness.py --output "$RUNNER_TEMP/chat-archive-readiness"
      - uses: actions/upload-artifact@v4
        with:
          name: harness-chat-${{ steps.package.outputs.revision }}
          path: chat-artifact/
          if-no-files-found: error
          retention-days: 30
  engine-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python engine_readiness.py --output engine-readiness-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-readiness-results
          path: engine/engine-readiness-results/
          if-no-files-found: warn
  campaign-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_campaign.py -v
  invention-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_global_invention.py -v
      - run: python research_run.py --target lih-wang --output lih-wang-run --passes 3 --seconds 60
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lih-wang-exact-run
          path: engine/lih-wang-run/
          if-no-files-found: warn
  tests:
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - name: Save exact-engine controls
        if: ${{ always() && matrix.python == '3.12' }}
        run: python core_regression.py --output core-control-results
      - name: Upload exact-engine control evidence
        if: ${{ always() && matrix.python == '3.12' }}
        uses: actions/upload-artifact@v4
        with:
          name: core-control-results
          path: engine/core-control-results/
          if-no-files-found: warn
      - run: python benchmarks.py
      - run: python harness.py example --target-file targets/example.json --plan
      - run: python project.py validate examples/known-star
      - run: python examples/known-star/repro/verify.py
  citation-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install cffconvert==2.0.0
      - run: cffconvert --validate
      - run: |
          python project.py init /tmp/research-citation-test --id control --statement 'Synthetic fixture'
          python discovery_citation.py /tmp/research-citation-test examples/confirmed-metadata.example.json
          python project.py seal /tmp/research-citation-test
          python project.py validate /tmp/research-citation-test --publication
          cffconvert -i /tmp/research-citation-test/CITATION.cff --validate
  example-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended
      - working-directory: engine/examples/known-star/paper
        run: |
          pdflatex -no-shell-escape -halt-on-error paper.tex
          pdflatex -no-shell-escape -halt-on-error paper.tex
      - uses: actions/upload-artifact@v4
        with:
          name: known-control-paper
          path: engine/examples/known-star/paper/paper.pdf
